[project]
name = "gilda"
version = "0.1.0"
description = "A web service for associations."
requires-python = ">=3.13,<3.14"
dependencies = [
    "litestar[standard]",
    "advanced-alchemy",
    "asyncpg",
]

[dependency-groups]
dev = [
    "pytest",
    "ruff",
    "mypy",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--durations=10 --durations-min=0"
filterwarnings = ["ignore::DeprecationWarning:advanced_alchemy.*"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "ASYNC", "RUF"]

[tool.mypy]
strict = true
packages = ["gilda"]
mypy_path = "src"

[tool.ruff.lint.per-file-ignores]
"migrations/*" = ["E501"]
