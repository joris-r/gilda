{% extends "layout.html" %}
{% block main %}
<div id="forgot-password">
  <h1>{{ t("forgotPassword.title") }}</h1>
  <form class="panel" data-on:submit="@post('/forgot-password', {filterSignals: {exclude: /^language$/}})">
    <label>
      {{ t("fields.email") }}
      <input data-bind:email type="email" autocomplete="email" required>
    </label>
    {% include "form_error.html" %}
    <button type="submit">{{ t("forgotPassword.submit") }}</button>
  </form>
  <p class="hint"><a href="/">{{ t("forgotPassword.back") }}</a></p>
</div>
{% endblock %}
