{% extends "layout.html" %}
{% block main %}
{% if usable %}
<div id="reset-password">
  <h1>{{ t("resetPassword.title") }}</h1>
  <form class="panel" data-on:submit='@post("/reset-password", {payload: {token: {{ token|tojson }}, password: $password}})'>
    <label>
      {{ t("resetPassword.password") }}
      <input data-bind:password type="password" autocomplete="new-password" minlength="8" required>
    </label>
    {% include "form_error.html" %}
    <button type="submit">{{ t("resetPassword.submit") }}</button>
  </form>
</div>
{% else %}
{% include "reset_password_invalid.html" %}
{% endif %}
{% endblock %}
