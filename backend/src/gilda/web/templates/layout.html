<!doctype html>
<html lang="{{ language }}">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, interactive-widget=resizes-content">
    <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
    <link rel="stylesheet" href="/static/style.css">
    <script type="module" src="/static/datastar.js"></script>
    <title>Gilda</title>
  </head>
  <body>
    <div
      id="app"
      data-signals="{_failed: false}"
      data-on:datastar-fetch="$_failed = evt.detail.type === 'started' ? false : ['error', 'retrying', 'retries-failed'].includes(evt.detail.type) || $_failed"
    >
      <header class="top">
        <a href="/" class="brand" aria-label="Gilda"><img class="logo" src="/static/favicon.svg" alt=""></a>
        {% block location %}{% endblock %}
        <div class="top-actions">
          {% block header_actions %}{% include "language_selector.html" %}{% endblock %}
        </div>
      </header>
      <main>
        {% block main %}{% endblock %}
        <p id="notice" role="status"{% if not notice %} hidden{% endif %}>{{ notice }}</p>
        <p class="error" style="display: none" data-show="$_failed">{{ t("error") }}</p>
      </main>
    </div>
  </body>
</html>
