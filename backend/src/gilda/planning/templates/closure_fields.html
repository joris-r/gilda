{# The fields of a closure's dialog. #}
<label>
  {{ t("settings.first") }}
  <input type="date" data-bind:first required>
</label>
<label>
  {{ t("settings.last") }}
  <input type="date" data-bind:last required>
</label>
<label>
  {{ t("settings.label") }}
  <input type="text" data-bind:label>
</label>
